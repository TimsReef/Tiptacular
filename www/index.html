<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tip Calculator</title>
<style>
:root{--accent:#2563eb;--radius:18px;--shadow:0 8px 20px rgba(0,0,0,.12)}
body.transparent{--text:#0f172a;--muted:#475569;--card:rgba(255,255,255,.28);--key:rgba(255,255,255,.25);--button:rgba(255,255,255,.22);--border:rgba(255,255,255,.35);--shadow:0 10px 30px rgba(0,0,0,.25);background:transparent}
body.light{--text:#0f172a;--muted:#64748b;--card:#fff;--key:#f1f5f9;--button:#e2e8f0;--border:#e2e8f0;background:linear-gradient(180deg,#f6f8fb,#eef2f7)}
body.dark{--text:#e5e7eb;--muted:#9ca3af;--card:#111827;--key:#1f2937;--button:#1f2937;--border:#374151;background:linear-gradient(180deg,#0f172a,#020617)}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);overflow:hidden}
body.transparent .card,body.transparent .key,body.transparent .icon-btn,body.transparent .control{backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),12px);gap:clamp(10px,1.5vh,16px);box-sizing:border-box}
.header{font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.header-actions{display:flex;gap:.4rem}
.icon-btn{border:none;background:var(--button);color:var(--text);border-radius:10px;width:2.2rem;height:2.2rem;display:flex;align-items:center;justify-content:center}
.main{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:clamp(10px,1.4vh,16px);min-height:0}
.left-panel{display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px)}
.right-panel{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.card{background:var(--card);border-radius:var(--radius);padding:clamp(12px,1.8vh,18px);box-shadow:var(--shadow);border:1px solid var(--border)}
.display{font-size:clamp(26px,4.5vh,40px);font-weight:700;margin-bottom:clamp(10px,1.4vh,14px);text-align:right;white-space:nowrap;overflow:hidden}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vh,14px)}
.control{background:var(--button);border-radius:12px;padding:.65rem;text-align:center}
.control-title{font-size:12px;color:var(--muted)}
.control-value{font-size:18px;font-weight:600;margin:4px 0}
.control-buttons{display:flex;justify-content:center;gap:.4rem}
.control-buttons button{border:none;background:var(--card);border-radius:8px;width:28px;height:28px}
.tip-selector{display:flex;gap:.5rem;margin-top:.65rem}
.tip-btn{flex:1;border:none;border-radius:10px;padding:.5rem 0;background:var(--button)}
.tip-btn.active{background:var(--accent);color:#fff}
.results{display:grid;grid-template-columns:1fr auto;row-gap:.5rem;column-gap:.5rem;font-size:clamp(14px,2vh,17px)}
.label{color:var(--muted)}
.value{text-align:right;font-weight:600}
.total{font-size:clamp(18px,2.6vh,22px);font-weight:700}
.round-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.round-options{display:flex;gap:.4rem}
.round-btn{border:none;background:var(--button);border-radius:8px;padding:.25rem .6rem}
.round-btn.active{background:var(--accent);color:#fff}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(8px,1.2vh,14px)}
.key{border:none;border-radius:clamp(12px,1.6vh,18px);font-size:clamp(22px,5vh,32px);background:var(--key);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.swipe-hint{text-align:center;font-size:11px;color:var(--muted)}
@media (orientation:landscape){.main{grid-template-columns:1.1fr .9fr;grid-template-rows:1fr}.tip-selector{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
<span id="headerTitle" style="display:flex;align-items:center;gap:.5rem"><img src="assets/icon/icon.png" style="width:22px;height:22px;border-radius:5px">Tip Calculator</span>
<div class="header-actions">
<button class="icon-btn" id="cameraBtn">📷</button>
<button class="icon-btn" id="soundBtn">🔊</button>
<button class="icon-btn" id="themeBtn">🫧</button>
</div>
</div>
<div class="main">
<div class="left-panel">
<div class="card">
<div id="subtotalDisplay" class="display">$0.00</div>
<div class="controls">
<div class="control">
<div class="control-title">People</div>
<div id="people" class="control-value">1</div>
<div class="control-buttons"><button id="peopleMinus">−</button><button id="peoplePlus">＋</button></div>
</div>
<div class="control">
<div class="control-title">Tip</div>
<div id="tipPercent" class="control-value">18%</div>
<div class="control-buttons"><button id="tipMinus">−</button><button id="tipPlus">＋</button></div>
</div>
</div>
<div class="tip-selector">
<button class="tip-btn" data-tip="15">15%</button>
<button class="tip-btn active" data-tip="18">18%</button>
<button class="tip-btn" data-tip="20">20%</button>
<button class="tip-btn" data-tip="25">25%</button>
</div>
</div>
<div class="card results" id="resultsCard">
<div class="label">Tip</div><div id="tipAmount" class="value">$0.00</div>
<div class="label total">Total</div><div id="totalAmount" class="value total">$0.00</div>
<div class="label">Per Person</div><div id="splitAmount" class="value">$0.00</div>
<div class="round-row"><span>Rounding</span><div class="round-options">
<button class="round-btn active" data-round="none">None</button>
<button class="round-btn" data-round="tip">Tip</button>
<button class="round-btn" data-round="total">Total</button>
</div></div>
</div>
</div>
<div class="right-panel">
<div class="keypad" id="keypad"></div>
<div class="swipe-hint">Swipe left anywhere to clear</div>
</div>
</div>
</div>
<script>
let inputRaw="";
let people=1;
let tipPercent=18;
let roundMode="none";
let soundEnabled=true;
let themeMode="transparent";
const MAX_INPUT_LENGTH=14;

const subtotalDisplay=document.getElementById("subtotalDisplay");
const tipAmount=document.getElementById("tipAmount");
const totalAmount=document.getElementById("totalAmount");
const splitAmount=document.getElementById("splitAmount");
const peopleDisplay=document.getElementById("people");
const tipPercentDisplay=document.getElementById("tipPercent");

function update(){
 const subtotal=parseFloat(inputRaw||0);
 let tip=subtotal*(tipPercent/100);
 let total=subtotal+tip;

 if(roundMode==="total"){total=Math.ceil(total);tip=total-subtotal}
 if(roundMode==="tip"){tip=Math.ceil(tip);total=subtotal+tip}

 const split=total/people;

 subtotalDisplay.innerText=formatInput(inputRaw);
 tipAmount.innerText=fmt(tip);
 totalAmount.innerText=fmt(total);
 splitAmount.innerText=fmt(split);
}

function fmt(v){return v.toLocaleString(undefined,{style:"currency",currency:"USD"})}

function formatInput(v){
 if(!v) return "$0.00";
 const parts=v.split(".");
 const whole=parseInt(parts[0]||"0",10).toLocaleString();
 if(parts[1]!=null) return "$"+whole+"."+parts[1];
 return "$"+whole;
}

function press(v){
 if(inputRaw.length>=MAX_INPUT_LENGTH) return;
 if(v==='.' && inputRaw.includes('.')) return;
 inputRaw+=v;
 update();
}

function backspace(){
 inputRaw=inputRaw.slice(0,-1);
 update();
}

function clearInput(){inputRaw="";update()}

function changePeople(v){people=Math.max(1,people+v);peopleDisplay.innerText=people;update()}
function changeTip(v){tipPercent=Math.max(0,tipPercent+v);tipPercentDisplay.innerText=tipPercent+"%";update()}
function setTip(v){tipPercent=v;tipPercentDisplay.innerText=v+"%";update()}

function setRound(v){
 roundMode=v;
 document.querySelectorAll(".round-btn").forEach(b=>b.classList.toggle("active",b.dataset.round===v));
 update();
}

function buildKeypad(){
 const keypad=document.getElementById("keypad");
 const keys=["1","2","3","4","5","6","7","8","9",".","0","⌫"];
 keys.forEach(k=>{
  const btn=document.createElement("button");
  btn.className="key";
  btn.textContent=k;
  btn.onclick=()=>k==="⌫"?backspace():press(k);
  keypad.appendChild(btn);
 });
}

function applyTheme(){
 document.body.classList.remove("transparent","light","dark");
 document.body.classList.add(themeMode);
}

function toggleTheme(){
 themeMode=themeMode==="transparent"?"light":themeMode==="light"?"dark":"transparent";
 applyTheme();
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 document.getElementById("soundBtn").innerText=soundEnabled?"🔊":"🔇";
}

// swipe clear
let startX=null;
document.getElementById("app").addEventListener("touchstart",e=>{startX=e.touches[0].clientX});
document.getElementById("app").addEventListener("touchend",e=>{
 if(startX-e.changedTouches[0].clientX>120) clearInput();
 startX=null;
});

// =============================
// Receipt Scanner (Rebuilt)
// =============================

let scannerActive=false;
let videoEl=null;
let canvasEl=null;
let ctx=null;
let scanLoopId=null;

function createScannerUI(){
 const overlay=document.createElement("div");
 overlay.id="scannerOverlay";
 overlay.style.cssText="position:fixed;inset:0;background:black;z-index:9999";

 videoEl=document.createElement("video");
 videoEl.autoplay=true;
 videoEl.playsInline=true;
 videoEl.muted=true; // prevents mobile play button overlay
 videoEl.controls=false;
 videoEl.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";

 canvasEl=document.createElement("canvas");
 canvasEl.style.cssText="position:absolute;inset:0";

 const close=document.createElement("button");
 close.textContent="✕";
 close.style.cssText="position:absolute;top:20px;right:20px;font-size:24px;border:none;background:rgba(0,0,0,.6);color:white;border-radius:10px;width:40px;height:40px";
 close.onclick=stopScanner;

 overlay.appendChild(videoEl);
 overlay.appendChild(canvasEl);
 overlay.appendChild(close);

 document.body.appendChild(overlay);

 ctx=canvasEl.getContext("2d");
}

async function startScanner(){
 if(scannerActive) return;
 scannerActive=true;
 frozen=false;
 stableFrames=0;

 createScannerUI();

 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
 videoEl.srcObject=stream;

 // ensure the preview starts immediately (prevents play icon flash)
 await videoEl.play().catch(()=>{});

 videoEl.onloadedmetadata=()=>{
  canvasEl.width=videoEl.videoWidth;
  canvasEl.height=videoEl.videoHeight;
  requestAnimationFrame(scanLoop);
 };
}

function stopScanner(){
 scannerActive=false;

 if(scanLoopId) cancelAnimationFrame(scanLoopId);

 if(videoEl && videoEl.srcObject){
  videoEl.srcObject.getTracks().forEach(t=>t.stop());
 }

 const overlay=document.getElementById("scannerOverlay");
 if(overlay) overlay.remove();
}

// dynamic rectangle detection (face‑style behavior)
let stableFrames=0;
let frozen=false;
let detectedRect=null;

function detectReceipt(){
 const w=canvasEl.width;
 const h=canvasEl.height;

 const frame=ctx.getImageData(0,0,w,h);
 const data=frame.data;

 // grayscale + simple edge detection
 const edges=new Uint8Array(w*h);

 for(let y=1;y<h-1;y++){
  for(let x=1;x<w-1;x++){
   const i=(y*w+x)*4;

   const gx = (
     data[i-4] + 2*data[i] + data[i+4]
     - data[i-4 + w*4] - 2*data[i + w*4] - data[i+4 + w*4]
   );

   const gy = (
     data[i-4] + 2*data[i-4 + w*4] + data[i-4 + w*8]
     - data[i+4] - 2*data[i+4 + w*4] - data[i+4 + w*8]
   );

   const mag=Math.abs(gx)+Math.abs(gy);
   edges[y*w+x]=mag>200?255:0;
  }
 }

 // find bounding box of largest edge cluster (simple contour approximation)
 let minX=w, minY=h, maxX=0, maxY=0;
 let count=0;

 for(let y=0;y<h;y+=2){
  for(let x=0;x<w;x+=2){
   if(edges[y*w+x]){
    count++;
    if(x<minX) minX=x;
    if(y<minY) minY=y;
    if(x>maxX) maxX=x;
    if(y>maxY) maxY=y;
   }
  }
 }

 if(count<500){
  stableFrames=Math.max(0,stableFrames-1);
  return detectedRect;
 }

 const rect={
  x:minX,
  y:minY,
  width:maxX-minX,
  height:maxY-minY
 };

 // confidence scoring (aspect ratio + size)
 const aspect=rect.height/(rect.width||1);
 const area=(rect.width*rect.height)/(w*h);

 const confidence = (
  (aspect>1.2 && aspect<5 ? 0.5:0) +
  (area>0.2 && area<0.9 ? 0.5:0)
 );

 if(confidence>0.7){
  stableFrames++;
  detectedRect=rect;
 }else{
  stableFrames=Math.max(0,stableFrames-1);
 }

 return detectedRect || rect;
}

function scanLoop(){
 if(!scannerActive) return;

 ctx.drawImage(videoEl,0,0,canvasEl.width,canvasEl.height);

 const rect=detectReceipt();

 // draw dynamic detection rectangle like phone face detection
 ctx.strokeStyle = stableFrames>5 ? "#00ff9c" : "rgba(255,255,255,.7)";
 ctx.lineWidth=4;
 ctx.strokeRect(rect.x,rect.y,rect.width,rect.height);

 // HUD
 ctx.fillStyle="rgba(0,0,0,.55)";
 ctx.fillRect(12,12,220,70);
 ctx.fillStyle="#00ff9c";
 ctx.font="14px monospace";
 ctx.fillText("Receipt Detection",22,34);
 ctx.fillText("Stability: "+stableFrames,22,56);

 // freeze frame once detection stabilizes
 if(stableFrames>18 && !frozen){
  frozen=true;
  scannerActive=false;

  // capture final frame
  ctx.drawImage(videoEl,0,0,canvasEl.width,canvasEl.height);

  videoEl.pause();

  ctx.strokeStyle="#00ff9c";
  ctx.lineWidth=5;
  ctx.strokeRect(rect.x,rect.y,rect.width,rect.height);

  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(12,12,250,70);
  ctx.fillStyle="#00ff9c";
  ctx.fillText("Receipt Detected",22,36);
  ctx.fillText("Image Frozen",22,58);

  return;
 }

 scanLoopId=requestAnimationFrame(scanLoop);
}

// =============================

// buttons

document.getElementById("peopleMinus").onclick=()=>changePeople(-1);
document.getElementById("peoplePlus").onclick=()=>changePeople(1);
document.getElementById("tipMinus").onclick=()=>changeTip(-1);
document.getElementById("tipPlus").onclick=()=>changeTip(1);

document.querySelectorAll(".tip-btn").forEach(b=>b.onclick=()=>setTip(parseInt(b.dataset.tip)));
document.querySelectorAll(".round-btn").forEach(b=>b.onclick=()=>setRound(b.dataset.round));

document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("soundBtn").onclick=toggleSound;
document.getElementById("cameraBtn").onclick=startScanner;

// init
buildKeypad();
applyTheme();
update();
</script>

<script type="module" src="/js/bundle.js"></script>
</body>
</html>
