<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tip Calculator</title>
    <style>
        :root {
            --accent:#2563eb;
            --radius:18px;
            --shadow:0 8px 20px rgba(0,0,0,.12);
        }

        body.transparent {
            --text:#0f172a;
            --muted:#475569;
            --card:rgba(255,255,255,.28);
            --key:rgba(255,255,255,.25);
            --button:rgba(255,255,255,.22);
            --border:rgba(255,255,255,.35);
            --shadow:0 10px 30px rgba(0,0,0,.25);
            background: transparent;
        }

        body.light {
            --text:#0f172a;
            --muted:#64748b;
            --card:#ffffff;
            --key:#f1f5f9;
            --button:#e2e8f0;
            --border:#e2e8f0;
            --shadow:0 8px 20px rgba(0,0,0,.10);
            background: linear-gradient(180deg,#f6f8fb,#eef2f7);
        }

        body.dark {
            --text:#e5e7eb;
            --muted:#9ca3af;
            --card:#111827;
            --key:#1f2937;
            --button:#1f2937;
            --border:#374151;
            --shadow:0 10px 26px rgba(0,0,0,.45);
            background: linear-gradient(180deg,#0f172a,#020617);
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            color: var(--text);
            overflow: hidden;
        }

            body.transparent .card, body.transparent .key, body.transparent .icon-btn, body.transparent .control {
                backdrop-filter: blur(22px) saturate(160%);
                -webkit-backdrop-filter: blur(22px) saturate(160%);
            }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: max(env(safe-area-inset-top),8px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),12px);
            gap: clamp(10px,1.5vh,16px);
            box-sizing: border-box;
        }

        .header {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .header-actions {
            display: flex;
            gap: 0.4rem;
        }

        .icon-btn {
            border: none;
            background: var(--button);
            color: var(--text);
            border-radius: 10px;
            width: 2.2rem;
            height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: clamp(10px,1.4vh,16px);
            min-height: 0;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: clamp(10px,1.4vh,16px);
            min-height: 0;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            gap: clamp(8px,1.2vh,14px);
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: clamp(12px,1.8vh,18px);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .display {
            font-size: clamp(26px,4.5vh,40px);
            font-weight: 700;
            margin-bottom: clamp(10px,1.4vh,14px);
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px,1.4vh,14px);
        }

        .control {
            background: var(--button);
            border-radius: 12px;
            padding: 0.65rem;
            text-align: center;
        }

        .control-title {
            font-size: 12px;
            color: var(--muted);
        }

        .control-value {
            font-size: 18px;
            font-weight: 600;
            margin: 4px 0;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
        }

            .control-buttons button {
                border: none;
                background: var(--card);
                border-radius: 8px;
                width: 28px;
                height: 28px;
            }

        .tip-selector {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.65rem;
        }

        .tip-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 0.5rem 0;
            background: var(--button);
        }

            .tip-btn.active {
                background: var(--accent);
                color: white;
            }

        .results {
            display: grid;
            grid-template-columns: 1fr auto;
            row-gap: 0.5rem;
            column-gap: 0.5rem;
            font-size: clamp(14px,2vh,17px);
        }

        .label {
            color: var(--muted);
        }

        .value {
            text-align: right;
            font-weight: 600;
        }

        .total {
            font-size: clamp(18px,2.6vh,22px);
            font-weight: 700;
        }

        .round-row {
            grid-column: 1/-1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .round-options {
            display: flex;
            gap: 0.4rem;
        }

        .round-btn {
            border: none;
            background: var(--button);
            border-radius: 8px;
            padding: 0.25rem 0.6rem;
        }

            .round-btn.active {
                background: var(--accent);
                color: white;
            }

        .keypad {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(4,1fr);
            gap: clamp(8px,1.2vh,14px);
            min-height: 0;
        }

        .key {
            border: none;
            border-radius: clamp(12px,1.6vh,18px);
            font-size: clamp(22px,5vh,32px);
            background: var(--key);
            color: var(--text);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swipe-hint {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }

        @media (orientation: landscape) {
            .main {
                grid-template-columns: 1.1fr .9fr;
                grid-template-rows: 1fr;
            }

            .tip-selector {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <span style="display:flex;align-items:center;gap:0.5rem;">
                <img src="assets/icon/icon.png" alt="app icon" style="width:22px;height:22px;border-radius:5px;">Tip Calculator
            </span>
            <div class="header-actions">
                <button class="icon-btn" id="cameraBtn" onclick="captureReceipt()">📷</button>
                <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🫧</button>
            </div>
        </div>
        <div class="main">
            <div class="left-panel">
                <div class="card">
                    <div id="subtotalDisplay" class="display">$0.00</div>
                    <div class="controls">
                        <div class="control">
                            <div class="control-title">People</div>
                            <div id="people" class="control-value">1</div>
                            <div class="control-buttons">
                                <button onclick="changePeople(-1)">−</button>
                                <button onclick="changePeople(1)">＋</button>
                            </div>
                        </div>
                        <div class="control">
                            <div class="control-title">Tip</div>
                            <div id="tipPercent" class="control-value">18%</div>
                            <div class="control-buttons">
                                <button onclick="changeTip(-1)">−</button>
                                <button onclick="changeTip(1)">＋</button>
                            </div>
                        </div>
                    </div>
                    <div class="tip-selector">
                        <button class="tip-btn" onclick="setTip(15)">15%</button>
                        <button class="tip-btn active" onclick="setTip(18)">18%</button>
                        <button class="tip-btn" onclick="setTip(20)">20%</button>
                        <button class="tip-btn" onclick="setTip(25)">25%</button>
                    </div>
                </div>
                <div class="card results" id="resultsCard">
                    <div class="label">Tip</div>
                    <div id="tipAmount" class="value">$0.00</div>
                    <div class="label total">Total</div>
                    <div id="totalAmount" class="value total">$0.00</div>
                    <div class="label">Per Person</div>
                    <div id="splitAmount" class="value">$0.00</div>
                    <div class="round-row">
                        <span>Rounding</span>
                        <div class="round-options">
                            <button class="round-btn active" onclick="setRounding('none')">None</button>
                            <button class="round-btn" onclick="setRounding('tip')">Tip</button>
                            <button class="round-btn" onclick="setRounding('total')">Total</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="keypad">
                    <button class="key" onclick="press('1')">1</button>
                    <button class="key" onclick="press('2')">2</button>
                    <button class="key" onclick="press('3')">3</button>
                    <button class="key" onclick="press('4')">4</button>
                    <button class="key" onclick="press('5')">5</button>
                    <button class="key" onclick="press('6')">6</button>
                    <button class="key" onclick="press('7')">7</button>
                    <button class="key" onclick="press('8')">8</button>
                    <button class="key" onclick="press('9')">9</button>
                    <button class="key" onclick="press('.')">.</button>
                    <button class="key" onclick="press('0')">0</button>
                    <button class="key" onclick="backspace()">⌫</button>
                </div>
                <div class="swipe-hint">Swipe left anywhere to clear</div>
            </div>
        </div>
    </div>
    <script>

        let inputRaw="";
        let people=1;
        let tipPercent=18;
        let roundMode='none';
        let soundEnabled=true;
        let themeMode='transparent';
        const MAX_INPUT_LENGTH=14;

        const app=document.getElementById('app');
        const subtotalDisplay=document.getElementById('subtotalDisplay');
        const resultsCard=document.getElementById('resultsCard');
        const tipAmount=document.getElementById('tipAmount');
        const totalAmount=document.getElementById('totalAmount');
        const splitAmount=document.getElementById('splitAmount');
        const peopleDisplay=document.getElementById('people');
        const tipPercentDisplay=document.getElementById('tipPercent');
        const cameraBtn=document.getElementById('cameraBtn');

        const isNativeCapacitor = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if(!isNativeCapacitor && cameraBtn){cameraBtn.style.display='none';}

        function update(){
            const subtotal=parseFloat(inputRaw||0);
            let tip=subtotal*(tipPercent/100);
            let total=subtotal+tip;
            if(roundMode==='total'){total=Math.ceil(total);tip=total-subtotal;}
            if(roundMode==='tip'){tip=Math.ceil(tip);total=subtotal+tip;}
            const split=total/people;
            subtotalDisplay.innerText=formatInput(inputRaw);
            format(tip,tipAmount);format(total,totalAmount);format(split,splitAmount);
        }

        function format(v,el){el.innerText=v.toLocaleString(undefined,{style:'currency',currency:'USD'});}
        function formatInput(v){if(!v)return '$0.00';return '$'+Number(v).toLocaleString();}

        function press(v){if(inputRaw.length>=MAX_INPUT_LENGTH)return;if(v==='.'&&inputRaw.includes('.'))return;inputRaw+=v;update();}
        function backspace(){inputRaw=inputRaw.slice(0,-1);update();}
        function changePeople(v){people=Math.max(1,people+v);peopleDisplay.innerText=people;update();}
        function changeTip(v){tipPercent=Math.max(0,tipPercent+v);tipPercentDisplay.innerText=tipPercent+"%";update();}
        function setTip(v){tipPercent=v;tipPercentDisplay.innerText=v+"%";update();}
        function setRounding(m){roundMode=m;update();}

        function toggleTheme(){themeMode=themeMode==='transparent'?'light':themeMode==='light'?'dark':'transparent';applyTheme();}
        function applyTheme(){document.body.classList.remove('transparent','light','dark');document.body.classList.add(themeMode);}applyTheme();

        let audioCtx=null;let clickBuffer=null;
        function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();const l=audioCtx.sampleRate*.02;clickBuffer=audioCtx.createBuffer(1,l,audioCtx.sampleRate);const d=clickBuffer.getChannelData(0);for(let i=0;i<l;i++){d[i]=(Math.random()*2-1)*(1-i/l);} }
        function playClick(){if(!audioCtx||!clickBuffer)return;const s=audioCtx.createBufferSource();const g=audioCtx.createGain();s.buffer=clickBuffer;g.gain.value=.12;s.connect(g);g.connect(audioCtx.destination);s.start();}
        function toggleSound(){soundEnabled=!soundEnabled;document.getElementById('soundBtn').innerText=soundEnabled?'🔊':'🔇';}

        app.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||!soundEnabled)return;if(!audioCtx)initAudio();playClick();});

        let startX=null;
        app.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;});
        app.addEventListener('touchend',e=>{if(startX===null)return;const endX=e.changedTouches[0].clientX;if(startX-endX>120){inputRaw="";update();}startX=null;});

        const scannerLogs=[];let scanFrameCounter=0;
        function logScan(step,status="info",metrics={}){scannerLogs.push({t:Date.now(),step:String(step),status:String(status),frame:scanFrameCounter,...metrics});}

            const APP_VERSION="1.0.0";const APP_NAME="Tip Calculator";
            let aboutTapTimes=[];let debugMode=false;let cvDebugEnabled=false;

            function openAbout(){const modal=document.createElement('div');modal.id='aboutModal';modal.style.position='fixed';modal.style.inset='0';modal.style.zIndex='10000';modal.style.background='rgba(0,0,0,.55)';modal.style.display='flex';modal.style.alignItems='center';modal.style.justifyContent='center';debugMode=false;aboutTapTimes=[];
                modal.innerHTML=`<div id="aboutContent" style="background:var(--card);color:var(--text);padding:20px;border-radius:16px;width:90%;max-width:520px;max-height:80vh;box-shadow:var(--shadow);display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin-bottom:10px"><img src="assets/icon/icon.png" style="width:28px;height:28px;border-radius:6px"> ${APP_NAME}</div><div style="font-size:14px;margin-bottom:8px">Version ${APP_VERSION}</div><div id="tosBlock" style="font-size:13px;overflow:auto;max-height:40vh">Tip Calculator License Agreement...</div><div id="debugBlock" style="display:none;margin-top:10px;flex:1;min-height:0"></div><div style="margin-top:16px;text-align:right"><button onclick="closeAbout()" style="padding:.4rem .8rem;border:none;border-radius:8px;background:var(--button)">Close</button></div></div>`;
                document.body.appendChild(modal);
                const content=document.getElementById('aboutContent');if(content)content.addEventListener('click',handleAboutTap);
            }

            function closeAbout(){const m=document.getElementById('aboutModal');if(m)m.remove();}
            function handleAboutTap(){const now=Date.now();aboutTapTimes.push(now);aboutTapTimes=aboutTapTimes.filter(t=>now-t<5000);if(aboutTapTimes.length>=5){debugMode=true;showDebugLogs();}}

            function toggleCvDebug(){cvDebugEnabled=!cvDebugEnabled;const btn=document.getElementById("toggleCvDebugBtn");if(btn){btn.innerText=cvDebugEnabled?"Disable CV Overlay":"Enable CV Overlay";}}

            function showDebugLogs(){const tos=document.getElementById('tosBlock');const dbg=document.getElementById('debugBlock');if(!dbg||!tos)return;tos.style.display='none';dbg.style.display='block';dbg.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px"><button id="emailLogsBtn" style="padding:.3rem .6rem;border:none;border-radius:6px;background:var(--button)">Email Logs</button><button id="toggleCvDebugBtn" style="padding:.3rem .6rem;border:none;border-radius:6px;background:var(--button)">Enable CV Overlay</button></div><div style="max-height:45vh;overflow:auto;border:1px solid var(--border);border-radius:8px"><table id="logTable" style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr><th data-col="t">Time</th><th data-col="step">Step</th><th data-col="status">Status</th><th data-col="frame">Frame</th></tr></thead><tbody></tbody></table></div>`;
                renderLogTable();
                const btn=document.getElementById("toggleCvDebugBtn");if(btn)btn.onclick=toggleCvDebug;
                const emailBtn=document.getElementById('emailLogsBtn');if(emailBtn)emailBtn.onclick=emailLogs;
                document.querySelectorAll('#logTable th').forEach(th=>{th.onclick=()=>sortLogs(th.dataset.col);});
            }

            function renderLogTable(){const tbody=document.querySelector('#logTable tbody');if(!tbody)return;tbody.innerHTML="";scannerLogs.forEach(l=>{const tr=document.createElement('tr');const time=new Date(l.t).toLocaleTimeString();tr.innerHTML=`<td>${time}</td><td>${l.step||''}</td><td>${l.status||''}</td><td>${l.frame??''}</td>`;tbody.appendChild(tr);});}

            function emailLogs(){try{const body=encodeURIComponent(JSON.stringify(scannerLogs,null,2));window.location.href=`mailto:?subject=Tip%20Calculator%20Scanner%20Logs&body=${body}`;}catch(e){}}

            function sortLogs(col){scannerLogs.sort((a,b)=>a[col]>b[col]?1:-1);renderLogTable();}

            const headerTitle=document.querySelector('.header span');if(headerTitle)headerTitle.addEventListener('click',openAbout);

            update();

            // ---------------- Scanner -----------------
            let scannerActive=false;let scannerStableFrames=0;let lastQuad=null;let scanLoopId=null;

            async function captureReceipt(){logScan("capture_start");if(!isNativeCapacitor){console.warn('native only');return;}if(scannerActive)return;const CameraPreview=window.Capacitor?.Plugins?.CameraPreview;if(!CameraPreview){alert('Install camera-preview');return;}scannerActive=true;createScannerOverlay();
                try{await CameraPreview.start({parent:'scannerPreview',position:'rear',width:window.innerWidth,height:window.innerHeight,toBack:false});startScanLoop();}catch(err){console.error(err);stopScanner();}}

            function createScannerOverlay(){let overlay=document.getElementById('scannerOverlay');if(overlay)return;overlay=document.createElement('div');overlay.id='scannerOverlay';overlay.style.position='fixed';overlay.style.inset='0';overlay.style.zIndex='9999';overlay.style.background='black';overlay.innerHTML=`<div id="scannerPreview" style="position:absolute;inset:0"></div><canvas id="scannerCanvas" style="position:absolute;inset:0"></canvas><button id="closeScanner" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:18px;border:none">✕</button><button id="cancelScanner" style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:.7rem 1.2rem;border:none;border-radius:10px">Cancel</button>`;document.body.appendChild(overlay);

                // attach handlers AFTER element exists
                const closeBtn=document.getElementById('closeScanner');
                const cancelBtn=document.getElementById('cancelScanner');
                if(closeBtn)closeBtn.onclick=stopScanner;
                if(cancelBtn)cancelBtn.onclick=stopScanner;
            }

            async function startScanLoop(){const CameraPreview=window.Capacitor.Plugins.CameraPreview;const canvas=document.getElementById('scannerCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;
                async function scan(){scanFrameCounter++;if(!scannerActive)return;try{const frame=await CameraPreview.captureSample({quality:40});if(!frame?.value){scanLoopId=requestAnimationFrame(scan);return;}const img=new Image();img.src="data:image/jpeg;base64,"+frame.value;img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);const quad=detectReceiptQuad(canvas.width,canvas.height,img);if(quad){drawQuad(ctx,quad);drawDebugOverlay(ctx,quad);if(lastQuad&&quadSimilarity(quad,lastQuad)>0.92){scannerStableFrames++;}else{scannerStableFrames=0;}lastQuad=quad;if(scannerStableFrames>=3){autoCapture(frame.value);return;}}};}catch(e){}
                scanLoopId=requestAnimationFrame(scan);}scan();}

        function detectReceiptQuad(w,h,img){if(!window.cv||!img)return null;try{const src=cv.imread(img);const gray=new cv.Mat();const blur=new cv.Mat();const edges=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,75,200);const contours=new cv.MatVector();const hierarchy=new cv.Mat();cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);let bestQuad=null;let bestScore=0;for(let i=0;i<contours.size();i++){const cnt=contours.get(i);const peri=cv.arcLength(cnt,true);const approx=new cv.Mat();cv.approxPolyDP(cnt,approx,0.02*peri,true);if(approx.rows===4){const pts=[];for(let j=0;j<4;j++){const p=approx.intPtr(j,0);pts.push({x:p[0],y:p[1]});}bestQuad=pts;bestScore=1;}approx.delete();cnt.delete();}src.delete();gray.delete();blur.delete();edges.delete();contours.delete();hierarchy.delete();return bestScore?bestQuad:null;}catch(e){return null;}}

        function drawDebugOverlay(ctx,quad){if(!cvDebugEnabled||!quad)return;ctx.fillStyle='rgba(0,255,0,.15)';ctx.beginPath();ctx.moveTo(quad[0].x,quad[0].y);ctx.lineTo(quad[1].x,quad[1].y);ctx.lineTo(quad[2].x,quad[2].y);ctx.lineTo(quad[3].x,quad[3].y);ctx.closePath();ctx.fill();}

        function drawQuad(ctx,q){if(!q||q.length!==4)return;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,180,255,0.95)';ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);ctx.lineTo(q[1].x,q[1].y);ctx.lineTo(q[2].x,q[2].y);ctx.lineTo(q[3].x,q[3].y);ctx.closePath();ctx.stroke();}

        function quadSimilarity(a,b){if(!a||!b)return 0;let total=0;for(let i=0;i<4;i++){const dx=a[i].x-b[i].x;const dy=a[i].y-b[i].y;total+=Math.sqrt(dx*dx+dy*dy);}const avg=total/4;const diag=Math.hypot(window.innerWidth,window.innerHeight);return 1-(avg/diag);}

        async function autoCapture(base64){const imgData="data:image/jpeg;base64,"+base64;const img=new Image();img.src=imgData;img.onload=async()=>{let preview=document.getElementById('receiptPreviewContainer');if(!preview){preview=document.createElement('div');preview.id='receiptPreviewContainer';preview.style.position='fixed';preview.style.bottom='10px';preview.style.right='10px';preview.style.zIndex='9999';const im=document.createElement('img');im.id='receiptPreview';im.style.width='140px';const close=document.createElement('button');close.innerText='✕';close.onclick=()=>preview.remove();preview.appendChild(im);preview.appendChild(close);document.body.appendChild(preview);}document.getElementById('receiptPreview').src=imgData;};stopScanner();}

        async function stopScanner(){scannerActive=false;scannerStableFrames=0;lastQuad=null;if(scanLoopId)cancelAnimationFrame(scanLoopId);try{const CameraPreview=window.Capacitor?.Plugins?.CameraPreview;if(CameraPreview)await CameraPreview.stop();}catch(e){}const overlay=document.getElementById('scannerOverlay');if(overlay)overlay.remove();}

    </script>

<script type="module" src="/js/bundle.js">
</script>
</body>
</html>
