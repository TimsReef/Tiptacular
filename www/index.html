<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tiptacular</title>
<style>
:root{--accent:#2563eb;--radius:18px;--shadow:0 8px 20px rgba(0,0,0,.12)}
body.transparent{--text:#0f172a;--muted:#475569;--card:rgba(255,255,255,.28);--key:rgba(255,255,255,.25);--button:rgba(255,255,255,.22);--border:rgba(255,255,255,.35);--shadow:0 10px 30px rgba(0,0,0,.25);background:transparent}
body.light{--text:#0f172a;--muted:#64748b;--card:#fff;--key:#f1f5f9;--button:#e2e8f0;--border:#e2e8f0;background:linear-gradient(180deg,#f6f8fb,#eef2f7)}
body.dark{--text:#e5e7eb;--muted:#9ca3af;--card:#111827;--key:#1f2937;--button:#1f2937;--border:#374151;background:linear-gradient(180deg,#0f172a,#020617)}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);overflow:hidden}
body.transparent .card,body.transparent .key,body.transparent .icon-btn,body.transparent .control{backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),12px);gap:clamp(10px,1.5vh,16px);box-sizing:border-box}
.header{font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.header-actions{display:flex;gap:.4rem}
.icon-btn{border:none;background:var(--button);color:var(--text);border-radius:10px;width:2.2rem;height:2.2rem;display:flex;align-items:center;justify-content:center}
.main{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:clamp(10px,1.4vh,16px);min-height:0}
.left-panel{display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px)}
.right-panel{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.card{background:var(--card);border-radius:var(--radius);padding:clamp(12px,1.8vh,18px);box-shadow:var(--shadow);border:1px solid var(--border)}
.display{font-size:clamp(26px,4.5vh,40px);font-weight:700;margin-bottom:clamp(10px,1.4vh,14px);text-align:right;white-space:nowrap;overflow:hidden}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vh,14px)}
.control{background:var(--button);border-radius:12px;padding:.65rem;text-align:center}
.control-title{font-size:12px;color:var(--muted)}
.control-value{font-size:18px;font-weight:600;margin:4px 0}
.control-buttons{display:flex;justify-content:center;gap:.4rem}
.control-buttons button{border:none;background:var(--card);border-radius:8px;width:28px;height:28px}
.tip-selector{display:flex;gap:.5rem;margin-top:.65rem}
.tip-btn{flex:1;border:none;border-radius:10px;padding:.5rem 0;background:var(--button)}
.tip-btn.active{background:var(--accent);color:#fff}
.results{display:grid;grid-template-columns:1fr auto;row-gap:.5rem;column-gap:.5rem;font-size:clamp(14px,2vh,17px)}
.label{color:var(--muted)}
.value{text-align:right;font-weight:600}
.total{font-size:clamp(18px,2.6vh,22px);font-weight:700}
.round-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.round-options{display:flex;gap:.4rem}
.round-btn{border:none;background:var(--button);border-radius:8px;padding:.25rem .6rem}
.round-btn.active{background:var(--accent);color:#fff}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(8px,1.2vh,14px)}
.key{border:none;border-radius:clamp(12px,1.6vh,18px);font-size:clamp(22px,5vh,32px);background:var(--key);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.swipe-hint{text-align:center;font-size:11px;color:var(--muted)}
@media (orientation:landscape){.main{grid-template-columns:1.1fr .9fr;grid-template-rows:1fr}.tip-selector{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
<span id="headerTitle" style="display:flex;align-items:center;gap:.5rem"><img src="assets/icon/icon.png" style="width:22px;height:22px;border-radius:5px">Tiptacular</span>
<div class="header-actions">
<button class="icon-btn" id="cameraBtn">📷</button>
<button class="icon-btn" id="soundBtn">🔊</button>
<button class="icon-btn" id="themeBtn">🫧</button>
</div>
</div>
<div class="main">
<div class="left-panel">
<div class="card">
<div id="subtotalDisplay" class="display">$0.00</div>
<div class="controls">
<div class="control">
<div class="control-title">People</div>
<div id="people" class="control-value">1</div>
<div class="control-buttons"><button id="peopleMinus">−</button><button id="peoplePlus">＋</button></div>
</div>
<div class="control">
<div class="control-title">Tip</div>
<div id="tipPercent" class="control-value">18%</div>
<div class="control-buttons"><button id="tipMinus">−</button><button id="tipPlus">＋</button></div>
</div>
</div>
<div class="tip-selector">
<button class="tip-btn" data-tip="15">15%</button>
<button class="tip-btn active" data-tip="18">18%</button>
<button class="tip-btn" data-tip="20">20%</button>
<button class="tip-btn" data-tip="25">25%</button>
</div>
</div>
<div class="card results" id="resultsCard">
<div class="label">Tip</div><div id="tipAmount" class="value">$0.00</div>
<div class="label total">Total</div><div id="totalAmount" class="value total">$0.00</div>
<div class="label">Per Person</div><div id="splitAmount" class="value">$0.00</div>
<div class="round-row"><span>Rounding</span><div class="round-options">
<button class="round-btn active" data-round="none">None</button>
<button class="round-btn" data-round="tip">Tip</button>
<button class="round-btn" data-round="total">Total</button>
</div></div>
</div>
</div>
<div class="right-panel">
<div class="keypad" id="keypad"></div>
<div class="swipe-hint">Swipe left anywhere to clear</div>
</div>
</div>
</div>
<script>
let inputRaw="";
let people=1;
let tipPercent=18;
let roundMode="none";
let soundEnabled=true;
let themeMode="transparent";
const MAX_INPUT_LENGTH=14;

const subtotalDisplay=document.getElementById("subtotalDisplay");
const tipAmount=document.getElementById("tipAmount");
const totalAmount=document.getElementById("totalAmount");
const splitAmount=document.getElementById("splitAmount");
const peopleDisplay=document.getElementById("people");
const tipPercentDisplay=document.getElementById("tipPercent");

function update(){
 const subtotal=parseFloat(inputRaw||0);
 let tip=subtotal*(tipPercent/100);
 let total=subtotal+tip;

 if(roundMode==="total"){total=Math.ceil(total);tip=total-subtotal}
 if(roundMode==="tip"){tip=Math.ceil(tip);total=subtotal+tip}

 const split=total/people;

 subtotalDisplay.innerText=formatInput(inputRaw);
 tipAmount.innerText=fmt(tip);
 totalAmount.innerText=fmt(total);
 splitAmount.innerText=fmt(split);
}

function fmt(v){return v.toLocaleString(undefined,{style:"currency",currency:"USD"})}

function formatInput(v){
 if(!v) return "$0.00";
 const parts=v.split(".");
 const whole=parseInt(parts[0]||"0",10).toLocaleString();
 if(parts[1]!=null) return "$"+whole+"."+parts[1];
 return "$"+whole;
}

function press(v){
 if(inputRaw.length>=MAX_INPUT_LENGTH) return;
 if(v==='.' && inputRaw.includes('.')) return;
 inputRaw+=v;
 update();
}

function backspace(){
 inputRaw=inputRaw.slice(0,-1);
 update();
}

function clearInput(){
  inputRaw="";
  update()
}

function changePeople(v){people=Math.max(1,people+v);peopleDisplay.innerText=people;update()}
function changeTip(v){tipPercent=Math.max(0,tipPercent+v);tipPercentDisplay.innerText=tipPercent+"%";update()}
function setTip(v){tipPercent=v;tipPercentDisplay.innerText=v+"%";update()}

function setRound(v){
 roundMode=v;
 document.querySelectorAll(".round-btn").forEach(b=>b.classList.toggle("active",b.dataset.round===v));
 update();
}

function buildKeypad(){
 const keypad=document.getElementById("keypad");
 const keys=["1","2","3","4","5","6","7","8","9",".","0","⌫"];
 keys.forEach(k=>{
  const btn=document.createElement("button");
  btn.className="key";
  btn.textContent=k;
  btn.onclick=()=>k==="⌫"?backspace():press(k);
  keypad.appendChild(btn);
 });
}

// -----------------------------
// Theme
// -----------------------------

const savedTheme=localStorage.getItem('tipcalc-theme');
if(savedTheme) themeMode=savedTheme;

function applyTheme(){
 document.body.classList.remove('transparent','light','dark');
 document.body.classList.add(themeMode);

 const btn=document.getElementById('themeBtn');
 if(themeMode==='transparent') btn.innerText='🫧';
 if(themeMode==='light') btn.innerText='☀️';
 if(themeMode==='dark') btn.innerText='🌙';

 localStorage.setItem('tipcalc-theme',themeMode);
}

function toggleTheme(){
 themeMode=themeMode==="transparent"?"light":themeMode==="light"?"dark":"transparent";
 applyTheme();
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 document.getElementById("soundBtn").innerText=soundEnabled?"🔊":"🔇";
}

// -----------------------------
// Pointerdown sound trigger
// -----------------------------

app.addEventListener('pointerdown',e=>{

 const btn=e.target.closest('button');
 if(!btn) return;

 if(!soundEnabled) return;

 if(!audioCtx) initAudio();

 try{playClick()}catch(err){}

});

// -----------------------------
// Swipe Clear
// -----------------------------
let startX=null;
document.getElementById("app").addEventListener("touchstart",e=>{startX=e.touches[0].clientX});
document.getElementById("app").addEventListener("touchend",e=>{
 if(startX-e.changedTouches[0].clientX>120) clearInput();
 startX=null;
});

// =============================
// Receipt Scanner (Rebuilt)
// =============================

let scannerActive=false;
let videoEl=null;
let canvasEl=null;
let ctx=null;
let scanLoopId=null;

function createScannerUI(){
 logScan("createScannerUI");
 const overlay=document.createElement("div");
 overlay.id="scannerOverlay";
 overlay.style.cssText="position:fixed;inset:0;background:black;z-index:3";

 videoEl=document.createElement("video");
 videoEl.autoplay=true;
 videoEl.playsInline=true;
 videoEl.muted=true; // prevents mobile play button overlay
 videoEl.controls=false;  videoEl.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1";
 videoEl.preload = "metadata";

 canvasEl=document.createElement("canvas");
 canvasEl.style.cssText="position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none";

 const close=document.createElement("button");
 close.textContent="✕";
 close.style.cssText="position:absolute;top:20px;right:20px;font-size:24px;border:none;background:rgba(0,0,0,.6);color:white;border-radius:10px;width:40px;height:40px;z-index:9999";
 close.onclick=stopScanner;

 overlay.appendChild(videoEl);
 overlay.appendChild(canvasEl);
 overlay.appendChild(close);

 document.body.appendChild(overlay);

 ctx=canvasEl.getContext("2d");
 logScan("finish creatinng scanner ui");
}

async function startScanner(){
 if(scannerActive) return;

 loadOpenCV();

 logScan("start_scanner");

 scannerActive=true;
 frozen=false;
 stableFrames=0;

 createScannerUI();

 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
 videoEl.srcObject=stream;

 // ensure the preview starts immediately (prevents play icon flash)
 await videoEl.play().catch(()=>{});
  logScan("preview_play");

 // More reliable start for mobile (Android/iOS)
 const startScan = () => {
  logScan("startScan");
  if(!videoEl.videoWidth || !videoEl.videoHeight) return;

  canvasEl.width = videoEl.videoWidth;
  canvasEl.height = videoEl.videoHeight;

  logScan("startScanner", "Video Ready", videoEl.videoWidth+videoEl.videoHeight);

  requestAnimationFrame(scanLoop);
 };

 // Some devices never fire onloadedmetadata
 videoEl.onloadedmetadata = startScan;
 videoEl.onloadeddata = startScan;
 videoEl.oncanplay = startScan;

 // Fallback safety (critical for Android WebView)
 setTimeout(startScan, 500);

 logScan("finish preview_play");
}

function stopScanner(){
 scannerActive=false;

 logScan("stop_scanner");

 if(scanLoopId) cancelAnimationFrame(scanLoopId);

 if(videoEl && videoEl.srcObject){
  videoEl.srcObject.getTracks().forEach(t=>t.stop());
 }

 const overlay=document.getElementById("scannerOverlay");
 if(overlay) overlay.remove();
}

// =============================
// OpenCV Receipt Detection
// =============================
let cvReady=false;
let stableFrames=0;
let frozen=false;
let detectedRect=null;
let detectedQuad=null;

// load OpenCV
function loadOpenCV(){
  try {
  if(window.cv) { 
    cvReady=true;
    logScan("loadOpenCV", "window.cv", cvReady);
    return;
  }

  if(initializeOpenCV()) {
    cvReady=true;
  }
  logScan("loadOpenCV", "initializeOpenCV", cvReady);
  } catch(e) {
    logScan("loadOpenCV", "exception", e.toString());
  }
}

  
function detectReceipt(){
 logScan("detect_receipt");

 if(!cvReady) {
   logScan("detect_receipt", "detectedRect", detectedRect);
   return detectedRect;
 }
 try {
 const src=cv.imread(canvasEl);
 const gray=new cv.Mat();
 const blurred=new cv.Mat();
 const edges=new cv.Mat();
 const contours=new cv.MatVector();
 const hierarchy=new cv.Mat();

 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.GaussianBlur(gray,blurred,new cv.Size(5,5),0);
 cv.Canny(blurred,edges,75,200);

 cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);

 logScan("detect_receipt", "findContours", contours);

 let bestQuad=null;
 let maxArea=0;

 for(let i=0;i<contours.size();i++){
  const cnt=contours.get(i);
  const peri=cv.arcLength(cnt,true);
  const approx=new cv.Mat();
  cv.approxPolyDP(cnt,approx,0.02*peri,true);

  if(approx.rows===4){
   const area=cv.contourArea(cnt);
   if(area>maxArea){
    maxArea=area;
    bestQuad=approx;
    logScan("detect_receipt", "bestQuad", bestQuad);
   }
  }
 }

 logScan("detect_receipt", "bestQuad", bestQuad);

 if(!bestQuad){
  stableFrames=Math.max(0,stableFrames-1);
  src.delete();gray.delete();blurred.delete();edges.delete();contours.delete();hierarchy.delete();
  logScan("detect_receipt", "!bestQuad", detectedRect);
  return detectedRect;
 }

 const pts=[];
 for(let i=0;i<4;i++){
  pts.push({
   x:bestQuad.intPtr(i,0)[0],
   y:bestQuad.intPtr(i,0)[1]
  });
 }

 // sort points (tl,tr,br,bl)
 pts.sort((a,b)=>a.y-b.y);
 const top=pts.slice(0,2).sort((a,b)=>a.x-b.x);
 const bottom=pts.slice(2,4).sort((a,b)=>a.x-b.x);

 const tl=top[0];
 const tr=top[1];
 const bl=bottom[0];
 const br=bottom[1];

 const rect={
  x:tl.x,
  y:tl.y,
  width:tr.x-tl.x,
  height:bl.y-tl.y
 };

 const w=canvasEl.width;
 const h=canvasEl.height;
 const area=(rect.width*rect.height)/(w*h);

 if(area>0.2){
  stableFrames++;
  detectedRect=rect;
  detectedQuad={tl,tr,br,bl};
 }else{
  stableFrames=Math.max(0,stableFrames-1);
 }

 src.delete();gray.delete();blurred.delete();edges.delete();contours.delete();hierarchy.delete();
} catch (e) {
  logScan("detect_receipt", "exception", e.toString());
}
 logScan("detect_receipt", "rect", "returning");
 return detectedRect || rect;
}
  
function warpReceipt(){
 logScan("warp_receipt");

 if(!cvReady || !detectedQuad) {
   logScan("warp_receipt", "error", "notready");
   return null;
 }

 const src = cv.imread(canvasEl);
 const dsize = new cv.Size(600, 800);

 const srcTri = cv.matFromArray(4,1,cv.CV_32FC2,[
  detectedQuad.tl.x, detectedQuad.tl.y,
  detectedQuad.tr.x, detectedQuad.tr.y,
  detectedQuad.br.x, detectedQuad.br.y,
  detectedQuad.bl.x, detectedQuad.bl.y
 ]);

 const dstTri = cv.matFromArray(4,1,cv.CV_32FC2,[
  0,0,
  dsize.width,0,
  dsize.width,dsize.height,
  0,dsize.height
 ]);

 const M = cv.getPerspectiveTransform(srcTri, dstTri);
 const dst = new cv.Mat();

 cv.warpPerspective(src, dst, M, dsize);

 const outCanvas = document.createElement("canvas");
 cv.imshow(outCanvas, dst);

 src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();

 return outCanvas;
}

// =============================
// Text Region Detection (OpenCV)
// =============================
function extractTextRegions(canvas){
 if(!cvReady) return [];

 logScan("extract_text_regions");

 const src = cv.imread(canvas);
 const gray = new cv.Mat();
 const thresh = new cv.Mat();
 const morph = new cv.Mat();
 const contours = new cv.MatVector();
 const hierarchy = new cv.Mat();

 cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

 // Adaptive threshold to highlight text
 cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY_INV, 15, 10);

 // Morph close to connect text lines
 const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(25,5));
 cv.morphologyEx(thresh, morph, cv.MORPH_CLOSE, kernel);

 cv.findContours(morph, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

 const regions = [];
 const areaMin = (canvas.width * canvas.height) * 0.001;

 for(let i=0;i<contours.size();i++){
  const cnt = contours.get(i);
  const rect = cv.boundingRect(cnt);

  // filter likely text lines
  if(rect.width > rect.height*2 && rect.width*rect.height > areaMin){
   const roi = src.roi(rect);
   const c = document.createElement('canvas');
   cv.imshow(c, roi);
   regions.push({
     canvas: c,
     y: rect.y,
     x: rect.x,
     w: rect.width,
     h: rect.height
   });
   roi.delete();
  }
 }

 // sort top-to-bottom
 regions.sort((a,b)=>a.y-b.y);

 const out = regions.map(r=>r.canvas);

 src.delete(); gray.delete(); thresh.delete(); morph.delete(); contours.delete(); hierarchy.delete(); kernel.delete();

 window.lastRegions = regions;
  
 return out;
}  

async function runOCR(input){
 if(!input) return;

 logScan("run_ocr");

 const inputs = Array.isArray(input) ? input : [input];
 let combinedText = "";

 for(const c of inputs){
  try{
   // convert canvas → base64
   const base64 = c.toDataURL("image/jpeg", 0.9);

   // ML Kit OCR
   const text = await runNativeOCR(base64);

   if(text){
    combinedText += "\n" + text;
   }
  }catch(e){
   console.error("run_ocr", "ML Kit OCR failed", e.toString());
  }
 }

 console.log("ML KIT OCR TEXT:", combinedText);

 const parsed = parseReceipt(combinedText);

 if(parsed.total){
  inputRaw = parsed.total.toFixed(2);
  update();
  suggestTip(parsed.total);
 }
}

function parseReceipt(text){
 logScan("parse_receipt");

 const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);

 let bestTotal = null;
 let bestScore = -Infinity;
 const prices = [];

 // =============================
 // PASS 1: ANCHOR-BASED DETECTION
 // =============================

 for(let i=0;i<lines.length;i++){
  const line = lines[i];

  // Look for strong anchors
  if(/grand total/i.test(line) || /total/i.test(line) || /amount due|balance due/i.test(line)){
   
   const matches = line.match(/(\d+\.\d{2})/g);

   if(matches){
    // 🎯 take RIGHT-MOST number (most likely total)
    const value = parseFloat(matches[matches.length - 1]);

    return {
     total: value,
     prices: [value]
    };
   }

   // 🔥 If number is NOT on same line → check next line
   if(i < lines.length - 1){
    const next = lines[i+1];
    const nextMatch = next.match(/(\d+\.\d{2})/);

    if(nextMatch){
     const value = parseFloat(nextMatch[1]);

     return {
      total: value,
      prices: [value]
     };
    }
   }
  }
 }

 // =============================
 // PASS 2: SCORING FALLBACK
 // =============================

 lines.forEach((line,i)=>{
  const matches = line.match(/(\d+\.\d{2})/g);
  if(!matches) return;

  matches.forEach(v=>{
   const value = parseFloat(v);
   prices.push(value);

   let score = 0;

   if(/total/i.test(line)) score += 20;
   if(/amount|due|balance/i.test(line)) score += 15;

   score += (i / lines.length) * 6;

   if(value > 5 && value < 5000) score += 4;
   if(value < 1) score -= 10;

   if(/tax|subtotal|discount/i.test(line)) score -= 10;

   if(/\.(00|99|95|50)$/.test(v)) score += 2;
   if(/\d+\.\d{2}\s*$/.test(line)) score += 3;

   if(score > bestScore){
    bestScore = score;
    bestTotal = value;
   }
  });
 });

 // fallback safety
 if(!bestTotal && prices.length){
  bestTotal = Math.max(...prices);
 }

 return {
  total: bestTotal,
  prices
 };
}
  
function suggestTip(total){
 if(!total) return;

 logScan("sugest_tip");

 if(total < 20){
  setTip(20);   // small bills → higher %
 }else if(total < 100){
  setTip(18);   // normal
 }else{
  setTip(15);   // large bills → lower %
 }
} 

async function runNativeOCR(base64Image){
 if(!window.Capacitor || !Capacitor.Plugins){
  logScan("ImageToText not available (Capacitor & PlugIns)");
  return "";
 }

 logScan("run_native_ocr");

 try{
  const result = await Capacitor.Plugins.ImageToText.recognize({
   base64: base64Image
  });

  return result?.text || "";
 }catch(e){
  logScan("ImageToText OCR failed", "Exception", e.toString());
  return "";
 }
}

async function scanLoop(){
 if(!scannerActive) return;

try{
 logScan("scan_loop", "stableFrames", stableFrames);

 const scaleX = canvasEl.clientWidth / canvasEl.width;
 const scaleY = canvasEl.clientHeight / canvasEl.height;

 ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
 ctx.drawImage(videoEl,0,0,canvasEl.width,canvasEl.height);

 const rect=detectReceipt();
 logScan("scan_loop", "rectangle", rect);
 if(!rect){ scanLoopId=requestAnimationFrame(scanLoop); return; }

 logScan("scan_loop", "after:detectReceipt", rect);

 // draw receipt box
 ctx.strokeStyle = stableFrames>5 ? "#00ff9c" : "rgba(255,255,255,.7)";
 ctx.lineWidth=4;
 if(rect.width>0 && rect.height>0){ ctx.strokeRect(rect.x*scaleX,rect.y*scaleY,rect.width*scaleX,rect.height*scaleY); }

 // draw quad
 if(detectedQuad){
  ctx.fillStyle="#00ff9c";
  [detectedQuad.tl, detectedQuad.tr, detectedQuad.br, detectedQuad.bl].forEach(p=>{
   ctx.beginPath(); ctx.arc(p.x*scaleX,p.y*scaleY,6,0,Math.PI*2); ctx.fill();
  });
 }

 // =============================
 // REAL-TIME TEXT REGION + OCR
 // =============================
 let liveTotal=null;
 let confidence=0;

 if(cvReady && detectedQuad){
  const warped = warpReceipt();
  if(warped){
   const regions = extractTextRegions(warped);

   if(regions && regions.length){
    // lightweight OCR sampling (first few regions only for speed)
    const sample = regions.slice(-3);

    for (const c of sample) {
     const base64=c.toDataURL("image/jpeg",0.7);
     const text=await runNativeOCR(base64);

     if(text){
      const parsed=parseReceipt(text);
      if(parsed.total){
       liveTotal=parsed.total;
       confidence=Math.min(1, confidence+0.2);
      }
     }
        }

    // draw regions
    if(window.lastRegions){
     ctx.strokeStyle="rgba(0,150,255,0.7)";
     ctx.lineWidth=2;
     window.lastRegions.forEach(r=>{
      ctx.strokeRect(r.x*scaleX,r.y*scaleY,r.w*scaleX,r.h*scaleY);
     });
    }
   }
  }
 }

 // =============================
 // TOTAL HIGHLIGHT
 // =============================
 if(liveTotal){
  ctx.fillStyle="rgba(0,255,156,0.2)";
  ctx.fillRect(20,canvasEl.height-120,260,80);

  ctx.fillStyle="#00ff9c";
  ctx.font="18px monospace";
  ctx.fillText("TOTAL: $"+liveTotal.toFixed(2),30,canvasEl.height-80);
 }

 // =============================
 // CONFIDENCE HUD
 // =============================
 ctx.fillStyle="rgba(0,0,0,.55)";
 ctx.fillRect(12,12,260,90);
 ctx.fillStyle="#00ff9c";
 ctx.font="14px monospace";
 ctx.fillText("Receipt Detection",22,30);
 ctx.fillText("Stability: "+stableFrames,22,48);
 ctx.fillText("Confidence: "+Math.round(confidence*100)+"%",22,66);

 // =============================
 // AUTO CAPTURE
 // =============================
 if(stableFrames>18 && !frozen && confidence>0.5){
  frozen=true;
  scannerActive=false;

  ctx.drawImage(videoEl,0,0,canvasEl.width,canvasEl.height);
  videoEl.pause();

  const warped=warpReceipt();
  if(warped){
   ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
   ctx.drawImage(warped,0,0,canvasEl.width,canvasEl.height);

   const regions=extractTextRegions(warped);
   if(regions && regions.length){ runOCR(regions); }
   else{ runOCR(warped); }
  }

  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(12,12,260,70);
  ctx.fillStyle="#00ff9c";
  ctx.fillText("Captured",22,36);
  ctx.fillText("Running OCR...",22,56);

  return;
 }
} catch(e) {
  logScan("scanLoop", "exception", e.toString());
}

 scanLoopId=requestAnimationFrame(scanLoop);
}

// buttons

document.getElementById("peopleMinus").onclick=()=>changePeople(-1);
document.getElementById("peoplePlus").onclick=()=>changePeople(1);
document.getElementById("tipMinus").onclick=()=>changeTip(-1);
document.getElementById("tipPlus").onclick=()=>changeTip(1);

document.querySelectorAll(".tip-btn").forEach(b=>b.onclick=()=>setTip(parseInt(b.dataset.tip)));
document.querySelectorAll(".round-btn").forEach(b=>b.onclick=()=>setRound(b.dataset.round));

document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("soundBtn").onclick=toggleSound;
document.getElementById("cameraBtn").onclick=startScanner;

// init
buildKeypad();
applyTheme();
update();
</script>
