vars:
  GIT_BUILD_NUMBER:
    default: 1.0.0.0

platforms:
  ios:
    version: $GITHUB_BUILD_NUMBER
    targets:
      App:
        plist:
          - entries:
              - NSCameraUsageDescription: "This app needs access to the camera to take photos."
              - NSPhotoLibraryUsageDescription: "This app needs access to photos."
        buildNumber: $GITHUB_BUILD_NUMBER
  android:
    manifest:
      - file: AndroidManifest.xml
        target: manifest
        merge: |
          <manifest>
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          </manifest>
    versionName: $GIT_BUILD_NUMBER
    versionCode: $GIT_BUILD_NUMBER

